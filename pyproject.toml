[project]
name = "bunbird"
version = "0.1.0"
description = "BunBird Feishu connector and conversational worker"
requires-python = ">=3.12"
dependencies = [
    "lark-oapi==1.7.3",
    "httpx[socks]==0.28.1",
    "python-dotenv==1.2.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "python-docx>=1.2.0",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "xlwt>=1.3.0",
]

[project.scripts]
bunbird = "bunbird.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
